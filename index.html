
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>

    <main class="app">
        <header class="topbar">
            <div class="window-dots">
                <span class="dot red"></span>
                <span class="dot yellow"></span>
                <span class="dot green"></span>
            </div>

            <div class="brand">Task<span>Flow</span></div>

            <button id="themeToggle" class="theme-toggle"
                aria-label="Toggle colour theme">
                <span id="themeIcon">☾</span>
            </button>
        </header>

        <section class="task-section">
            <div class="eyebrow">YOUR PERSONAL SPACE</div>
            <h1>Today<span class="title-dot">.</span></h1>

            <nav class="tabs">
                <button class="tab active" id="currentTab">My List</button>
                <button class="tab" id="savedTab">Saved Lists</button>
            </nav>

            <section id="currentView">
                <div class="task-card">
                    <div class="list-heading">
                        <span>YOUR TASKS</span>
                        <span id="taskCount">0 tasks</span>
                    </div>

                    <div class="add-task-row">
                        <span class="plus-icon">+</span>
                        <input id="taskinput" type="text"
                            placeholder="What needs doing?"
                            autocomplete="off">
                        <button id="addtaskbutton">
                            Add <span>↗</span>
                        </button>
                    </div>

                    <ul id="taskList"></ul>

                    <div class="list-actions">
                        <button id="saveListButton" class="save-button">
                            Save list
                        </button>
                        <button id="deleteListButton" class="clear-button">
                            Delete list
                        </button>
                    </div>

                    <p id="statusMessage" class="status-message"
                        aria-live="polite"></p>
                </div>
            </section>

            <section id="savedView" hidden>
                <div class="task-card">
                    <div class="list-heading">
                        <span>SAVED LISTS</span>
                        <span id="savedCount">0 saved</span>
                    </div>

                    <div id="savedLists"></div>
                    <p id="emptySaved" class="empty-message">
                        Your saved lists will appear here.
                    </p>
                </div>
            </section>
        </section>

        <footer class="taskflow-footer">
            <p>Take control of your day with TaskFlow.</p>

            <div class="taskflow-actions">
                <a
                    class="taskflow-btn taskflow-download"
                    href="https://github.com/Dylanparker3700/taskflow/releases/latest"
                    target="_blank"
                    rel="noopener noreferrer">
                    Download for Windows
                </a>

                <a
                    class="taskflow-github-icon"
                    href="https://github.com/Dylanparker3700/taskflow"
                    target="_blank"
                    rel="noopener noreferrer"
                    aria-label="View TaskFlow on GitHub"
                    title="View on GitHub">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path fill="currentColor" d="M12 .9a11.1 11.1 0 0 0-3.51 21.63c.55.1.76-.24.76-.54v-2.1c-3.1.68-3.76-1.32-3.76-1.32-.5-1.3-1.24-1.65-1.24-1.65-1.01-.69.08-.68.08-.68 1.12.08 1.71 1.15 1.71 1.15 1 .1.76 2.2 3.2 1.68.1-.72.39-1.21.7-1.49-2.47-.28-5.07-1.24-5.07-5.5 0-1.22.44-2.21 1.15-2.99-.12-.28-.5-1.42.11-2.96 0 0 .94-.3 3.05 1.14a10.6 10.6 0 0 1 5.55 0c2.12-1.44 3.05-1.14 3.05-1.14.61 1.54.23 2.68.11 2.96.72.78 1.15 1.77 1.15 2.99 0 4.27-2.61 5.21-5.1 5.49.4.35.75 1.02.75 2.06v3.06c0 .3.2.65.77.54A11.1 11.1 0 0 0 12 .9Z"/>
                    </svg>
                </a>
            </div>
        </footer>

        <div id="modalOverlay" class="modal-overlay" hidden>
            <div class="modal">
                <div class="modal-icon" id="modalIcon">✦</div>
                <h2 id="modalTitle">Save your list</h2>
                <p id="modalMessage">
                    Choose a name for your saved list.
                </p>

                <input id="modalInput" type="text"
                    placeholder="Enter list name" maxlength="60">

                <div class="modal-actions">
                    <button id="modalCancel" class="modal-cancel">
                        Cancel
                    </button>
                    <button id="modalConfirm" class="modal-confirm">
                        Save list
                    </button>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
